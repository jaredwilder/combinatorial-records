name: C13 local degree cap CP-SAT

on:
  workflow_dispatch:
  push:
    paths:
      - 'covering-designs/C13-6-3/prove_link_degree_cap_cpsat.py'
      - '.github/workflows/c13-link-degree-cap-cpsat.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OR-Tools
        run: pip install 'ortools>=9.10,<10'
      - name: Solve independent local exact case
        run: python covering-designs/C13-6-3/prove_link_degree_cap_cpsat.py | tee c12_5_2_degree_cap_cpsat.log
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c12-5-2-degree-cap-cpsat
          path: |
            c12_5_2_degree_cap_cpsat.json
            c12_5_2_degree_cap_cpsat.log
